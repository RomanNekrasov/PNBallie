[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25,<26",
    "fastapi>=0.135.1",
    "httpx>=0.28,<1",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "pillow>=11,<13",
    "prometheus-client>=0.22,<1",
    "pyjwt[crypto]>=2.10,<3",
    "sqlmodel>=0.0.37",
    "uvicorn>=0.41.0",
]

[project.optional-dependencies]
avatar-gpu = [
    "accelerate>=1.2,<2",
    "diffusers>=0.36,<0.38",
    "sentencepiece>=0.2,<0.3",
    "torch>=2.9,<3",
    "torchvision>=0.24,<1",
    "transformers>=4.51,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E731"]
