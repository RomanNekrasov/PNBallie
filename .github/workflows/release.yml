name: Release PNBallie

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(backend/|frontend/|scripts/|.github/workflows/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/romannekrasov/pnballie-${{ matrix.service }}:sha-${{ env.IMAGE_SHA }}
          build-args: APP_REVISION=${{ env.IMAGE_SHA }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true
      - name: Verify manifest architectures
        run: |
          docker buildx imagetools inspect "ghcr.io/romannekrasov/pnballie-${{ matrix.service }}:sha-${IMAGE_SHA}" --raw > manifest.json
          jq -e '.manifests | any(.platform.os == "linux" and .platform.architecture == "amd64")' manifest.json
          jq -e '.manifests | any(.platform.os == "linux" and .platform.architecture == "arm64")' manifest.json
      - name: Ensure package remains private
        run: |
          token="$(curl --silent --fail "https://ghcr.io/token?scope=repository:romannekrasov/pnballie-${{ matrix.service }}:pull" | jq -r '.token // empty' || true)"
          if [ -n "$token" ] && curl --silent --fail --output /dev/null \
            --header "Authorization: Bearer ${token}" \
            --header "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/romannekrasov/pnballie-${{ matrix.service }}/manifests/sha-${IMAGE_SHA}"; then
            echo "Package pnballie-${{ matrix.service }} is publicly pullable; expected private visibility."
            exit 1
          fi
          echo "Package pnballie-${{ matrix.service }} rejects anonymous pulls."
      - name: Add immutable digest to workflow summary
        run: echo "- \`ghcr.io/romannekrasov/pnballie-${{ matrix.service }}:sha-${IMAGE_SHA}\` → \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Save digest
        run: echo '${{ steps.build.outputs.digest }}' > digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: digest.txt
  metadata:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
      - run: python3 scripts/release_metadata.py
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.json
  acceptance:
    needs: metadata
    uses: ./.github/workflows/deploy.yml
    with:
      target: acceptance
      revision: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
  production:
    needs: acceptance
    uses: ./.github/workflows/deploy.yml
    with:
      target: production
      revision: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
