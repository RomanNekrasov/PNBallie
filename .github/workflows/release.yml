name: Publish images

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/romannekrasov/pnballie-${{ matrix.service }}:sha-${{ env.IMAGE_SHA }}
          provenance: mode=max
          sbom: true
      - name: Verify manifest architectures
        run: |
          docker buildx imagetools inspect "ghcr.io/romannekrasov/pnballie-${{ matrix.service }}:sha-${IMAGE_SHA}" --raw > manifest.json
          jq -e '.manifests | any(.platform.os == "linux" and .platform.architecture == "amd64")' manifest.json
          jq -e '.manifests | any(.platform.os == "linux" and .platform.architecture == "arm64")' manifest.json
      - name: Ensure package remains private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility="$(gh api "/users/${{ github.repository_owner }}/packages/container/pnballie-${{ matrix.service }}" --jq .visibility)"
          test "$visibility" = private
      - name: Add immutable digest to workflow summary
        run: echo "- \`ghcr.io/romannekrasov/pnballie-${{ matrix.service }}:sha-${IMAGE_SHA}\` → \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
