include /tmp/pnballie-analytics-http.conf;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;
    # Raw request paths can contain invitations or OIDC codes. Operational
    # request telemetry is exported by the API using safe route templates.
    access_log off;
    error_log /dev/stderr crit;
    include /tmp/pnballie-analytics-server.conf;

    location = /config.json {
        alias /tmp/pnballie-config.json;
        add_header Cache-Control "no-store";
    }

    # Only the two exact tracker endpoints above are public, never Umami's UI,
    # reporting API, heartbeat, metrics or internal telemetry receivers.
    location = /analytics { return 404; }
    location ^~ /analytics/ { return 404; }
    location ~* ^/(metrics|traces|internal|v1/traces|api/metrics|api/internal|api/traces)(/|$) { return 404; }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /healthz {
        proxy_pass http://backend:8000/health/ready;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
